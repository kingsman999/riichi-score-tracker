<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>麻雀 Score Tracker</title>
<style>
  /* System font stack — no external network request */
  :root {
    --p0: #e05252;
    --p1: #4ea86b;
    --p2: #4a88d4;
    --p3: #c47fd4;
    --bg:     #0f0f14;
    --panel:  #17171f;
    --border: #2a2a38;
    --text:   #e8e4d8;
    --muted:  #666680;
    --gold:   #c9a84c;
    --font-serif: Georgia, 'Times New Roman', serif;
    --font-mono:  'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-serif);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 env(safe-area-inset-bottom, 16px);
    overflow-x: hidden;
  }

  /* ── Setup screen ── */
  #setup-screen {
    width: 100%;
    max-width: 420px;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .setup-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .setup-header .kanji {
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--text);
    letter-spacing: .1em;
  }
  .setup-header h1 {
    font-size: 1rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 400;
    margin-top: 4px;
  }
  .divider-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 8px 0 0;
    color: var(--muted);
    font-size: .65rem;
    letter-spacing: .2em;
  }
  .divider-row::before, .divider-row::after {
    content: '';
    flex: 1;
    max-width: 60px;
    height: 1px;
    background: var(--border);
  }

  .setup-section-label {
    font-size: .6rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .setup-players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
  }
  .setup-player-field {
    background: var(--panel);
    border-radius: 12px;
    border: 1.5px solid var(--border);
    padding: 10px 12px;
    position: relative;
    overflow: hidden;
  }
  .setup-player-field::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 12px 12px 0 0;
  }
  .spf-0::before { background: var(--p0); }
  .spf-1::before { background: var(--p1); }
  .spf-2::before { background: var(--p2); }
  .spf-3::before { background: var(--p3); }

  .setup-player-field label {
    font-size: .6rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 6px;
  }
  .spf-0 label { color: var(--p0); }
  .spf-1 label { color: var(--p1); }
  .spf-2 label { color: var(--p2); }
  .spf-3 label { color: var(--p3); }

  .setup-player-field input[type="text"] {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-serif);
    font-size: .95rem;
    padding: 4px 0;
    outline: none;
  }
  .setup-player-field input[type="text"]:focus { border-bottom-color: var(--gold); }

  .setup-score-row {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 28px;
  }
  .setup-score-row label {
    font-size: .65rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
    flex-shrink: 0;
  }
  .setup-score-row input[type="number"] {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--gold);
    font-family: var(--font-mono);
    font-size: 1.4rem;
    text-align: right;
    padding: 2px 0;
    outline: none;
    width: 130px;
    -moz-appearance: textfield;
  }
  .setup-score-row input[type="number"]::-webkit-inner-spin-button,
  .setup-score-row input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
  .setup-score-row input[type="number"]:focus { border-bottom-color: var(--gold); }

  .btn-start {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: var(--gold);
    color: #0f0f14;
    font-family: var(--font-mono);
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .btn-start:active { opacity: .85; }

  /* ── Main tracker ── */
  #tracker-screen { display: none; width: 100%; flex-direction: column; align-items: center; }
  #tracker-screen.visible { display: flex; }

  header {
    width: 100%;
    text-align: center;
    padding: 16px 16px 8px;
  }
  header h1 {
    font-size: 1rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 400;
  }
  header .kanji {
    font-size: 1.8rem;
    font-weight: 900;
    line-height: 1;
    color: var(--text);
    letter-spacing: .1em;
  }

  .total-banner {
    width: calc(100% - 24px);
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    font-family: var(--font-mono);
  }
  .total-label {
    font-size: .65rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .total-value { font-size: 1.1rem; font-weight: 700; }
  .total-value.ok   { color: var(--gold); }
  .total-value.warn { color: var(--p0); }

  .grid {
    width: calc(100% - 24px);
    max-width: 420px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .card {
    background: var(--panel);
    border-radius: 14px;
    border: 1.5px solid var(--border);
    padding: 14px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 14px 14px 0 0;
  }
  .card.p0::before { background: var(--p0); }
  .card.p1::before { background: var(--p1); }
  .card.p2::before { background: var(--p2); }
  .card.p3::before { background: var(--p3); }

  .card-label {
    font-size: .6rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card.p0 .card-label { color: var(--p0); }
  .card.p1 .card-label { color: var(--p1); }
  .card.p2 .card-label { color: var(--p2); }
  .card.p3 .card-label { color: var(--p3); }

  .card-score {
    font-family: var(--font-mono);
    font-size: 1.75rem;
    font-weight: 700;
    line-height: 1;
  }
  .card-score.negative { color: var(--p0); }

  .card-delta {
    font-family: var(--font-mono);
    font-size: .7rem;
    color: var(--muted);
    min-height: 14px;
  }
  .card-delta.pos { color: var(--p1); }
  .card-delta.neg { color: var(--p0); }

  .btn-row { display: flex; gap: 6px; }
  .btn {
    flex: 1;
    border: none;
    border-radius: 8px;
    padding: 9px 0;
    font-family: var(--font-mono);
    font-size: .85rem;
    cursor: pointer;
    font-weight: 700;
  }
  .btn:active { opacity: .75; }

  /* button backgrounds without color-mix (better compatibility) */
  .card.p0 .btn-add { background: #3a1f1f; color: var(--p0); }
  .card.p1 .btn-add { background: #1a2e22; color: var(--p1); }
  .card.p2 .btn-add { background: #1a2440; color: var(--p2); }
  .card.p3 .btn-add { background: #2a1f35; color: var(--p3); }
  .btn-sub { background: #2e1f1f; color: var(--p0); }

  /* ── Modal ── */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.72);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }

  /* No CSS animation on modal — avoids creating/destroying GPU layers on each open */
  .modal {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border-radius: 22px 22px 0 0;
    border-top: 1.5px solid var(--border);
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  }

  .modal-title {
    font-size: .75rem;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .modal-player {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .modal-player.p0 { color: var(--p0); }
  .modal-player.p1 { color: var(--p1); }
  .modal-player.p2 { color: var(--p2); }
  .modal-player.p3 { color: var(--p3); }

  .modal-input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .modal-sign {
    font-family: var(--font-mono);
    font-size: 1.6rem;
    font-weight: 700;
    width: 32px;
    text-align: center;
    flex-shrink: 0;
  }
  .modal-sign.plus  { color: var(--p1); }
  .modal-sign.minus { color: var(--p0); }

  input[type="number"].pts-input {
    flex: 1;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 1.6rem;
    padding: 10px 14px;
    outline: none;
    -moz-appearance: textfield;
    width: 100%;
  }
  input[type="number"].pts-input::-webkit-inner-spin-button,
  input[type="number"].pts-input::-webkit-outer-spin-button { -webkit-appearance: none; }
  input[type="number"].pts-input:focus { border-color: var(--gold); }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 18px;
  }
  .chip {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-family: var(--font-mono);
    font-size: .8rem;
    color: var(--text);
    cursor: pointer;
  }
  .chip:active { background: var(--border); }

  .modal-actions { display: flex; gap: 10px; }
  .btn-cancel {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: .95rem;
    cursor: pointer;
  }
  .btn-confirm {
    flex: 2;
    padding: 13px;
    border-radius: 12px;
    border: none;
    font-family: var(--font-mono);
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
  }
  .btn-confirm.p0 { background: var(--p0); }
  .btn-confirm.p1 { background: var(--p1); }
  .btn-confirm.p2 { background: var(--p2); }
  .btn-confirm.p3 { background: var(--p3); }
  .btn-confirm:active { opacity: .85; }

  /* ── Action row ── */
  .action-row {
    width: calc(100% - 24px);
    max-width: 420px;
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .btn-action {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: .75rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .btn-action:active { border-color: var(--text); color: var(--text); }

  /* ── History ── */
  .history-section {
    width: calc(100% - 24px);
    max-width: 420px;
    margin-top: 14px;
    padding-bottom: 16px;
  }
  .history-title {
    font-size: .6rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-height: 160px;
    overflow-y: auto;
    /* removed: -webkit-overflow-scrolling: touch (deprecated, causes GPU layer retention) */
  }
  .history-item {
    font-family: var(--font-mono);
    font-size: .72rem;
    color: var(--muted);
    padding: 5px 10px;
    background: var(--panel);
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  .history-item .hi-player {
    color: var(--text);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-item .hi-delta.pos { color: var(--p1); }
  .history-item .hi-delta.neg { color: var(--p0); }
</style>
</head>
<body>

<!-- ══ SETUP SCREEN ══ -->
<div id="setup-screen">
  <div class="setup-header">
    <div class="kanji">麻雀</div>
    <h1>Riichi Score Tracker</h1>
    <div class="divider-row">🀄 🀄 🀄</div>
  </div>

  <div class="setup-section-label">Player Names</div>
  <div class="setup-players">
    <div class="setup-player-field spf-0">
      <label>Player 1</label>
      <input type="text" id="name0" placeholder="Player 1" maxlength="14">
    </div>
    <div class="setup-player-field spf-1">
      <label>Player 2</label>
      <input type="text" id="name1" placeholder="Player 2" maxlength="14">
    </div>
    <div class="setup-player-field spf-2">
      <label>Player 3</label>
      <input type="text" id="name2" placeholder="Player 3" maxlength="14">
    </div>
    <div class="setup-player-field spf-3">
      <label>Player 4</label>
      <input type="text" id="name3" placeholder="Player 4" maxlength="14">
    </div>
  </div>

  <div class="setup-section-label">Starting Score</div>
  <div class="setup-score-row">
    <label>Points Each</label>
    <input type="number" id="start-score" value="30000" min="0" inputmode="numeric">
  </div>

  <button class="btn-start" id="btn-start">Start Game →</button>
</div>

<!-- ══ TRACKER SCREEN ══ -->
<div id="tracker-screen">
  <header>
    <div class="kanji">麻雀</div>
    <h1>Riichi Score Tracker</h1>
    <div class="divider-row">🀄 🀄 🀄</div>
  </header>

  <div class="total-banner">
    <span class="total-label">Combined Total</span>
    <span class="total-value ok" id="total">—</span>
  </div>

  <div class="grid" id="grid"></div>

  <div class="action-row">
    <button class="btn-action" id="btn-reset">↺ Reset Scores</button>
    <button class="btn-action" id="btn-newgame">⊕ New Game</button>
  </div>

  <div class="history-section">
    <div class="history-title">Recent Changes</div>
    <div class="history-list" id="history"></div>
  </div>
</div>

<!-- ══ SCORE MODAL ══ -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-title">Adjust Points</div>
    <div class="modal-player" id="modal-player-name"></div>
    <div class="modal-input-row">
      <div class="modal-sign" id="modal-sign">+</div>
      <input type="number" class="pts-input" id="modal-input" inputmode="numeric" placeholder="0" min="0">
    </div>
    <div class="chips" id="chips"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btn-cancel">Cancel</button>
      <button class="btn-confirm" id="btn-confirm">Apply</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const COLORS = ['p0','p1','p2','p3'];
  const QUICK  = [100, 300, 500, 1000, 2000, 3000, 5000, 8000];

  let players  = [];
  let scores   = [];
  let START    = 30000;
  let history  = [];
  let modalIdx  = null;
  let modalMode = 'add';

  // Timer IDs keyed by player index — stored in JS, not on DOM nodes
  const deltaTimers = {};

  // ── Helpers ──
  function fmt(n) { return n.toLocaleString(); }

  function escHtml(s) {
    return s
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function $(id) { return document.getElementById(id); }

  // ── Setup ──
  $('btn-start').addEventListener('click', startGame);

  function startGame() {
    const raw = parseInt($('start-score').value, 10);
    START = (!isNaN(raw) && raw >= 0) ? raw : 30000;

    players = COLORS.map((cls, i) => {
      const val = $('name' + i).value.trim();
      return { id: i, name: val || ('Player ' + (i + 1)), cls: cls };
    });
    scores  = players.map(function () { return START; });
    history = [];

    $('setup-screen').style.display = 'none';
    $('tracker-screen').classList.add('visible');

    buildGrid();
    updateScores();
    renderHistory();
  }

  // ── Grid ──
  function buildGrid() {
    const grid = $('grid');
    grid.innerHTML = '';
    players.forEach(function (p, i) {
      const card = document.createElement('div');
      card.className = 'card ' + p.cls;
      card.id = 'card-' + i;
      card.innerHTML =
        '<div class="card-label" id="label-' + i + '">' + escHtml(p.name) + '</div>' +
        '<div class="card-score" id="score-' + i + '">' + fmt(scores[i]) + '</div>' +
        '<div class="card-delta" id="delta-' + i + '"></div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-add" data-idx="' + i + '" data-mode="add">\uFF0B Add</button>' +
          '<button class="btn btn-sub" data-idx="' + i + '" data-mode="sub">\uFF0D Sub</button>' +
        '</div>';
      grid.appendChild(card);
    });

    // Single delegated listener — no per-button closures
    grid.addEventListener('click', function (e) {
      const btn = e.target.closest('button[data-idx]');
      if (btn) openModal(parseInt(btn.dataset.idx, 10), btn.dataset.mode);
    });
  }

  function updateScores() {
    players.forEach(function (p, i) {
      const el = $('score-' + i);
      if (!el) return;
      el.textContent = fmt(scores[i]);
      el.classList.toggle('negative', scores[i] < 0);
    });
    const total = scores.reduce(function (a, b) { return a + b; }, 0);
    const tel = $('total');
    tel.textContent = fmt(total);
    tel.className = 'total-value ' + (total === START * players.length ? 'ok' : 'warn');
    $('btn-reset').textContent = '\u21BA Reset to ' + fmt(START);
  }

  // ── Modal ──
  function openModal(idx, mode) {
    modalIdx  = idx;
    modalMode = mode;
    const p = players[idx];
    $('modal-player-name').textContent = p.name;
    $('modal-player-name').className   = 'modal-player ' + p.cls;
    $('btn-confirm').className         = 'btn-confirm ' + p.cls;
    $('modal-sign').textContent        = mode === 'add' ? '+' : '\u2212';
    $('modal-sign').className          = 'modal-sign ' + (mode === 'add' ? 'plus' : 'minus');
    $('modal-input').value             = '';

    // Rebuild chips
    const chips = $('chips');
    chips.innerHTML = '';
    const frag = document.createDocumentFragment();
    QUICK.forEach(function (v) {
      const c = document.createElement('button');
      c.className   = 'chip';
      c.textContent = fmt(v);
      c.dataset.val = v;
      frag.appendChild(c);
    });
    chips.appendChild(frag);

    $('modal').classList.add('open');
    // Delay focus — avoids forcing layout during open animation
    setTimeout(function () { $('modal-input').focus(); }, 100);
  }

  // Chip clicks delegated
  $('chips').addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-val]');
    if (btn) $('modal-input').value = btn.dataset.val;
  });

  function closeModal() {
    $('modal').classList.remove('open');
    $('modal-input').value = '';
    modalIdx = null;
  }

  // Close on backdrop click (not inner modal)
  $('modal').addEventListener('click', function (e) {
    if (e.target === $('modal')) closeModal();
  });
  $('btn-cancel').addEventListener('click', closeModal);

  function applyChange() {
    const raw = parseInt($('modal-input').value, 10);
    if (!raw || raw <= 0) { $('modal-input').focus(); return; }
    if (modalIdx === null) return;

    const delta = modalMode === 'add' ? raw : -raw;
    scores[modalIdx] += delta;

    // Flash delta label
    const dEl = $('delta-' + modalIdx);
    dEl.textContent = (delta > 0 ? '+' : '') + fmt(delta);
    dEl.className   = 'card-delta ' + (delta > 0 ? 'pos' : 'neg');
    clearTimeout(deltaTimers[modalIdx]);
    deltaTimers[modalIdx] = setTimeout(function () {
      const el = $('delta-' + modalIdx);
      if (el) { el.textContent = ''; el.className = 'card-delta'; }
    }, 2800);

    // Brief scale pulse via inline style (no CSS animation layer held)
    const card = $('card-' + modalIdx);
    card.style.transform = 'scale(1.04)';
    setTimeout(function () { card.style.transform = ''; }, 150);

    history.unshift({
      name : players[modalIdx].name,
      delta: delta,
      time : new Date().toLocaleTimeString('en', { hour: '2-digit', minute: '2-digit' })
    });
    if (history.length > 30) history.length = 30;  // truncate in-place
    renderHistory();
    updateScores();
    closeModal();
  }

  $('btn-confirm').addEventListener('click', applyChange);

  function renderHistory() {
    $('history').innerHTML = history.map(function (h) {
      return '<div class="history-item">' +
        '<span class="hi-player">' + escHtml(h.name) + '</span>' +
        '<span class="hi-delta ' + (h.delta > 0 ? 'pos' : 'neg') + '">' +
          (h.delta > 0 ? '+' : '') + fmt(h.delta) +
        '</span>' +
        '<span>' + h.time + '</span>' +
      '</div>';
    }).join('');
  }

  // ── Reset ──
  $('btn-reset').addEventListener('click', function () {
    if (!confirm('Reset all scores to ' + fmt(START) + '?')) return;
    scores = players.map(function () { return START; });
    history = [];
    // Cancel any pending delta timers
    Object.keys(deltaTimers).forEach(function (k) { clearTimeout(deltaTimers[k]); delete deltaTimers[k]; });
    players.forEach(function (p, i) {
      const dEl = $('delta-' + i);
      if (dEl) { dEl.textContent = ''; dEl.className = 'card-delta'; }
    });
    renderHistory();
    updateScores();
  });

  // ── New Game ──
  $('btn-newgame').addEventListener('click', function () {
    if (!confirm('Start a new game? This will clear all scores and return to setup.')) return;
    // Cancel timers before tearing down the grid
    Object.keys(deltaTimers).forEach(function (k) { clearTimeout(deltaTimers[k]); delete deltaTimers[k]; });
    $('tracker-screen').classList.remove('visible');
    $('setup-screen').style.display = 'flex';
    history = [];
    $('history').innerHTML = '';
    $('grid').innerHTML = '';
  });

  // ── Keyboard (single listener, never re-added) ──
  document.addEventListener('keydown', function (e) {
    if (!$('modal').classList.contains('open')) return;
    if (e.key === 'Enter')  applyChange();
    if (e.key === 'Escape') closeModal();
  });

})();
</script>
</body>
</html>
